<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    
    <linearGradient id="ringGlowTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glowEffectTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Navy Circular Background -->
  <circle cx="250" cy="250" r="235" fill="url(#avatarBg)" />
  
  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#ringGlowTeal)" stroke-width="5" filter="url(#glowEffectTeal)" opacity="0.9"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="#F8FAFC" stroke-width="2" opacity="0.4"/>

  <!-- Female Developer Vector Silhouette / Avatar -->
  <!-- Shoulders / Torso -->
  <path d="M 120,440 C 120,340 180,310 250,310 C 320,310 380,340 380,440 Z" fill="#0f172a" stroke="#6366f1" stroke-width="2" opacity="0.9"/>
  
  <!-- Neck -->
  <rect x="225" y="240" width="50" height="70" rx="10" fill="#ec4899" opacity="0.15"/>
  <rect x="225" y="240" width="50" height="70" rx="10" fill="#f1f5f9"/>

  <!-- Face -->
  <ellipse cx="250" cy="210" rx="65" ry="75" fill="#f8fafc"/>
  
  <!-- Hair (Rich brown style) -->
  <path d="M 175,200 C 170,120 200,90 250,90 C 300,90 330,120 325,200 C 320,240 335,280 340,320 C 315,310 310,240 305,200 C 300,140 280,115 250,115 C 220,115 200,140 195,200 C 190,240 185,310 160,320 C 165,280 180,240 175,200 Z" fill="#ca8a04" opacity="0.15"/>
  <path d="M 175,190 C 170,110 205,80 250,80 C 295,80 330,110 325,190 C 320,250 345,330 335,360 C 310,340 310,250 305,190 C 295,130 280,100 250,100 C 220,100 205,130 195,190 C 190,250 190,340 165,360 C 155,330 180,250 175,190 Z" fill="#7c2d12"/>

  <!-- Eyes -->
  <ellipse cx="225" cy="205" rx="6" ry="8" fill="#0f172a"/>
  <ellipse cx="275" cy="205" rx="6" ry="8" fill="#0f172a"/>
  
  <!-- Smile -->
  <path d="M 235,235 Q 250,248 265,235" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Developer Glasses -->
  <rect x="200" y="192" width="42" height="26" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
  <rect x="258" y="192" width="42" height="26" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
  <line x1="242" y1="205" x2="258" y2="205" stroke="#6366f1" stroke-width="3" />
  <line x1="185" y1="202" x2="200" y2="202" stroke="#6366f1" stroke-width="3" />
  <line x1="300" y1="202" x2="315" y2="202" stroke="#6366f1" stroke-width="3" />

  <!-- Code Symbol Badge -->
  <circle cx="340" cy="340" r="35" fill="#0B1120" stroke="#ec4899" stroke-width="3"/>
  <text x="340" y="347" font-family="monospace" font-size="22" font-weight="bold" fill="#ec4899" text-anchor="middle">&lt;/&gt;</text>
</svg>

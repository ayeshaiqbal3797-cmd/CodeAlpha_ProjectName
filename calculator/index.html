<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 — Calculator | CodeAlpha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div class="calculator-app">
    <!-- Header Controls -->
    <div class="header">
      <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
      <div class="header-actions">
        <button id="scientificToggleBtn" class="icon-btn" title="Toggle Scientific Mode"><i class="fa-solid fa-flask"></i></button>
        <button id="historyToggleBtn" class="icon-btn" title="View History"><i class="fa-solid fa-clock-rotate-left"></i></button>
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Light/Dark Theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>

    <!-- Main Container -->
    <div class="calculator-card">
      <!-- Display Screen -->
      <div class="display-container">
        <div class="expression-display" id="expressionDisplay"></div>
        <div class="result-display" id="resultDisplay">0</div>
      </div>

      <!-- Keypad -->
      <div class="keypad-container">
        <!-- Scientific Panel (hidden by default) -->
        <div class="scientific-panel" id="scientificPanel" style="display: none;">
          <button class="btn btn-sci" data-action="sin">sin</button>
          <button class="btn btn-sci" data-action="cos">cos</button>
          <button class="btn btn-sci" data-action="tan">tan</button>
          <button class="btn btn-sci" data-action="sqrt">√</button>
          <button class="btn btn-sci" data-action="pow">x²</button>
          <button class="btn btn-sci" data-action="log">log</button>
          <button class="btn btn-sci" data-action="pi">π</button>
          <button class="btn btn-sci" data-action="e">e</button>
        </div>

        <!-- Standard Grid -->
        <div class="keypad-grid">
          <button class="btn btn-clear" data-action="clear">AC</button>
          <button class="btn btn-func" data-action="backspace"><i class="fa-solid fa-backspace"></i></button>
          <button class="btn btn-func" data-action="percent">%</button>
          <button class="btn btn-operator" data-action="operator" data-val="/">÷</button>

          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-operator" data-action="operator" data-val="*">×</button>

          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-operator" data-action="operator" data-val="-">−</button>

          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-operator" data-action="operator" data-val="+">+</button>

          <button class="btn btn-func" data-action="negate">±</button>
          <button class="btn btn-num" data-val="0">0</button>
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>
      </div>
    </div>

    <!-- History Drawer Slide-out -->
    <div class="history-drawer" id="historyDrawer">
      <div class="history-header">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> History</h3>
        <div>
          <button id="clearHistoryBtn" class="text-btn">Clear</button>
          <button id="closeHistoryBtn" class="close-history-btn">&times;</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <p class="empty-history">No calculation history yet.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
